<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony Collection - Fixed Desktop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        :root {
            --second-color: #00439c;
            --white-color: #ffffff;
            --price-color: #00a896; /* L-on l-khder li andek f tswira */
            --shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        body { font-family: 'Arial', sans-serif; background: #fff; padding: 20px; }

        /* --- Header Style --- */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--second-color);
            margin-bottom: 30px;
            position: relative;
        }

        .section-title {
            background: var(--second-color);
            color: white;
            padding: 10px 25px;
            margin: 0;
            font-size: 14px;
            border-top-left-radius: 5px;
            text-transform: uppercase;
        }

        /* --- Arrows (Custom) --- */
        .playstation_button {
            display: none; /* Makhfiyin f Desktop */
            gap: 5px;
        }

        .playstation-prev, .playstation-next {
            background: var(--second-color);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Grid & Swiper Logic --- */
        .playstation-swiper {
            width: 100%;
            overflow: hidden;
        }

        /* Desktop Grid (Fach kibanou 4 cards m'gadin) */
        .product-grid.swiper-wrapper {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* Style dial Card b-hal tswira nichan */
        .p-card {
            background: white;
            border: 1px solid #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            transition: 0.3s;
            text-align: left;
            height: 100%;
        }

        .p-img {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .p-img img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .p-brand { color: #aaa; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        
        .p-details h3 {
            font-size: 15px;
            color: var(--second-color);
            margin: 10px 0;
            font-weight: 600;
            line-height: 1.3;
        }

        .p-shop {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
        }

        .p-price {
            font-size: 20px;
            font-weight: 800;
            color: var(--price-color);
        }

        .p-shop i {
            font-size: 24px;
            color: #666;
            background: #f5f5f5;
            padding: 8px;
            border-radius: 50%;
        }

        .p-stock { color: #28a745; font-size: 13px; margin-top: 10px; display: flex; align-items: center; }
        .dott { width: 8px; height: 8px; background: #28a745; border-radius: 50%; margin-right: 8px; }

        /* --- RESPONSIVE MOBILE --- */
        @media screen and (max-width: 992px) {
            .playstation_button { display: flex; } /* Bayn arrows */

            /* Reddiha Flex bach Swiper i-khdem */
            .product-grid.swiper-wrapper {
                display: flex; 
                grid-template-columns: none;
                gap: 0; 
            }

            .swiper-slide {
                width: auto;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <section class="tech-collection PlayStation">
        <div class="section-header">
            <h2 class="section-title">ULTIMATE GRAPHICS POWER</h2>
            <div class="section-controls playstation_button">
                <button class="playstation-prev"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="playstation-next"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>

        <div class="playstation-swiper swiper">
            <div class="product-grid swiper-wrapper">
                
                <div class="swiper-slide">
                    <div class="p-card">
                        <div class="p-img"><img src="assets/products/PlayStation/playStation_home/PlayStation-1.webp"></div>
                        <div class="p-details">
                            <span class="p-brand">SONY</span>
                            <h3>Sony PlayStation 5 Slim Digital Fortnite</h3>
                            <div class="p-shop">
                                <div class="p-price">5,490.00 dh</div>
                                <i class="fa-solid fa-bag-shopping"></i>
                            </div>
                            <div class="p-stock"><span class="dott"></span> In stock.</div>
                        </div>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="p-card">
                        <div class="p-img"><img src="assets/products/PlayStation/playStation_home/PlayStation-3.webp"></div>
                        <div class="p-details">
                            <span class="p-brand">SONY</span>
                            <h3>Sony PlayStation 5 Slim + 2ème Manette</h3>
                            <div class="p-shop">
                                <div class="p-price">6,999.00 dh</div>
                                <i class="fa-solid fa-bag-shopping"></i>
                            </div>
                            <div class="p-stock"><span class="dott"></span> In stock.</div>
                        </div>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="p-card">
                        <div class="p-img"><img src="assets/products/PlayStation/playStation_home/PlayStation-5.webp"></div>
                        <div class="p-details">
                            <span class="p-brand">SONY</span>
                            <h3>Sony PlayStation 4 Slim (500 Go)</h3>
                            <div class="p-shop">
                                <div class="p-price">3,299.00 dh</div>
                                <i class="fa-solid fa-bag-shopping"></i>
                            </div>
                            <div class="p-stock"><span class="dott"></span> In stock.</div>
                        </div>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="p-card">
                        <div class="p-img"><img src="assets/products/PlayStation/playStation_home/PlayStation-7.webp"></div>
                        <div class="p-details">
                            <span class="p-brand">SONY</span>
                            <h3>Sony PlayStation 5 Slim Digital Cobalt</h3>
                            <div class="p-shop">
                                <div class="p-price">6,599.00 dh</div>
                                <i class="fa-solid fa-bag-shopping"></i>
                            </div>
                            <div class="p-stock"><span class="dott"></span> In stock.</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.playstation-swiper', {
            // F-Desktop mat-khellich Swiper i-t-hrek
            breakpoints: {
                0: {
                    slidesPerView: 1.2,
                    spaceBetween: 15,
                    enabled: true,
                    navigation: {
                        nextEl: ".playstation-next",
                        prevEl: ".playstation-prev",
                    },
                },
                992: {
                    slidesPerView: 4,
                    spaceBetween: 20,
                    enabled: false, // Hbess slider f PC bach i-welli Grid
                }
            }
        });
    </script>
</body>
</html>
