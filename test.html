
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css_/deails.css">

  <style>
    /* Style pour le badge de la marque comme sur ton image */
.brand-badge {
    background-color: #28a745; /* Vert comme sur l'image */
    color: white;
    padding: 4px 12px;
    border-radius: 4px;
    display: inline-block;
    font-size: 0.8rem;
    font-weight: bold;
    margin-bottom: 10px;
}

#p-name {
    font-size: 1.5rem;
    color: #1a3fb5;
    font-weight: 700;
}

#p-price {
    color: #00bcd4; /* Couleur turquoise du prix */
    font-size: 1.6rem;
}

/* Section Description en bas */
.product-details-bottom {
    margin-top: 50px;
    border-top: 1px solid #eee;
    padding-top: 30px;
}

#p-full-title {
    color: #1a3fb5;
    font-size: 1.4rem;
    margin-bottom: 20px;
}

.full-description {
    font-size: 1.1rem;
    color: #333;
    line-height: 1.8;
}
  </style>
</head>
<body>


  <div class="container">
    <div id="loader">Loading product...</div>

    <div class="product-page" id="product-ui" style="display: none">
        <div class="thumb-list" id="gallery"></div>

        <div class="main-view">
            <img src="" id="main-img" alt="Product Image" />
        </div>

        <div class="product-info">
            <div class="brand-badge" id="p-brand"></div>
            <h2 id="p-name"></h2>
            <div class="price" id="p-price"></div>
            <button class="btn-cart">Add to card</button>
        </div>
    </div>

    <div class="product-details-bottom" id="bottom-info" style="display: none">
        <h1 id="p-full-title"></h1>
        <div class="full-description" id="p-desc"></div>
    </div>
</div>
  
</body>
</html>
