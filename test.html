<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css_/components/stracture.css">
    <link rel="stylesheet" href="css_/components/variables.css">
    <link rel="stylesheet" href="css_/components/header.css">

    
    <!-- link font icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />


    <style>
      /* =====================
   RESPONSIVE HEADER
   ===================== */

      /* Hamburger Button */
      .hamburger {
        
        width: 24px;
        height: 18px;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        color: black;
      }

      .hamburger i{
         font-size: 20px;
      }

      
      .hamburger.open span:nth-child(1) {
        transform: translateY(8px) rotate(45deg);
      }
      .hamburger.open span:nth-child(2) {
        opacity: 0;
      }
      .hamburger.open span:nth-child(3) {
        transform: translateY(-8px) rotate(-45deg);
      }

      /* ---- Tablet (≤ 1024px) ---- */
      @media (max-width: 1024px) {
        .top-header {
          padding: 12px 20px;
        }
        .navbar {
          padding: 10px 20px;
          gap: 16px;
        }
        .search-box {
          max-width: 360px;
        }
        .support {
          display: none;
        }
        .nav-links {
          gap: 16px;
        }
      }

      /* ---- Small Tablet (≤ 768px) ---- */
      @media (max-width: 768px) {
        /* Top header: logo + actions row, search below */
        .top-header {
          flex-wrap: wrap;
          gap: 10px;
          padding: 12px 16px;
        }

        .search-box {
          order: 3;
          flex: 1 1 100%;
          max-width: 100%;
          margin: 0;
        }

        /* Navbar: hamburger replaces links */
        .navbar {
          flex-wrap: wrap;
          padding: 0 16px;
          gap: 0;
          position: relative;
        }

        .hamburger {
          display: flex;
          margin-left: auto;
          padding: 14px 0;
          /* hamburger is inside dark navbar row */
        }

       

        .categories {
          padding: 10px 0;
         
        }

        /* Mobile nav links — hidden until toggled */
        .nav-links {
          flex-direction: column;
          width: 100%;
          gap: 0;
          max-height: 0;
          overflow: hidden;
          transition:
            max-height 0.35s ease,
            padding 0.35s ease;
          border-top: 1px solid #eee;
        }

        .nav-links.open {
          max-height: 300px;
          padding: 8px 0;
        }

        .nav-links a {
          display: block;
          padding: 10px 4px;
          border-bottom: 1px solid #f1f5f9;
          font-size: 13px;
        }

        .nav-links a::after {
          display: none;
        }

        /* Dropdown fills screen width on mobile */
        .dropdown-menu {
          min-width: 180px;
          font-size: 13px;
        }
      }

      /* ---- Mobile (≤ 480px) ---- */
      @media (max-width: 480px) {
        .logo h1 {
          font-size: 18px;
        }
        .logo-icon {
          padding: 8px;
        }
        .logo-icon i {
          font-size: 18px;
        }

        .account span {
          display: none;
        } /* hide "Hello, Sign in" label */
        .account-link {
          font-size: 13px;
        }

        .search-box input {
          padding: 9px 90px 9px 12px;
          font-size: 13px;
        }
        .search-box button {
          padding: 0 14px;
          font-size: 11px;
        }

        .header-actions {
          gap: 18px;
        }
      }
    </style>
  </head>
  <body>

    <header class="header">
      <div class="top-header">
        <div class="logo">
          <div class="logo-icon">
            <i class="fas fa-shopping-cart"></i>
          </div>
          <div>
            <h1>Tech Shop</h1>
          </div>
        </div>

        <div class="search-box">
          <input
            type="text"
            placeholder="Search for latest tech, gaming gear..."
          />
          <button>SEARCH</button>
        </div>

        <div class="header-actions">
          <div class="account">
            <span>Hello, Sign in</span>
            <div class="account-link">
              Account &amp; Lists <i class="fas fa-chevron-down"></i>
            </div>
          </div>
          <div class="cart" id="cart">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-badge" id="cart-badge">0</span>
          </div>
        </div>
      </div>

      <nav class="navbar">
        <div class="categories">
          <div class="category-btn">
            <i class="fas fa-bars"></i>
            <span>Browse Categories</span>
            <i class="fas fa-chevron-down" style="font-size: 10px"></i>
          </div>
          <ul class="dropdown-menu">
            <li><a href="#chair-section">Gaming Chairs</a></li>
            <li><a href="#desk-section">Gaming Desks</a></li>
            <li><a href="#controllers-section">Controllers</a></li>
            <li><a href="#playStation-section">PlayStation Gaming</a></li>
            <li><a href="#mous-section">Mouse Gaming</a></li>
            <li><a href="#ecran-section">Écran</a></li>
          </ul>
        </div>

        <!-- Hamburger toggle (visible on mobile only) -->
        <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="nav-links" id="nav-links">
          <a href="index.html">Home</a>
          <a href="shop-details.html">Shop</a>
          <a href="deals.html">Deals</a>
          <a href="#">Contact</a>
        </div>

        <div class="support">
          <i class="fas fa-headset"></i>
          <span>24/7 Support: +212 600 000 000</span>
        </div>
      </nav>
    </header>
  
    

    <script>
      // Hamburger menu toggle
      const hamburger = document.getElementById("hamburger");
      const navLinks = document.getElementById("nav-links");

      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("open");
        navLinks.classList.toggle("open");
      });

      // Close nav when a link is clicked
      navLinks.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          hamburger.classList.remove("open");
          navLinks.classList.remove("open");
        });
      });
    </script>
  </body>
</html>
